# Equivalente del endurecimiento de nginx.conf para Apache 2.4.
# Las mismas dos capas y los mismos hechos verificados.

<VirtualHost *:80>
    ServerName SITIO_FQDN
    Redirect permanent / https://SITIO_FQDN/
</VirtualHost>

<VirtualHost *:443>
    ServerName SITIO_FQDN

    # Capa 1: el docroot va a public/, no a la raiz del codigo.
    DocumentRoot /var/www/moodle/public

    SSLEngine on
    SSLCertificateFile    /etc/ssl/esoe/moodle.crt
    SSLCertificateKeyFile /etc/ssl/esoe/moodle.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"

    LimitRequestBody 104857600

    <Directory /var/www/moodle/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /r.php
    </Directory>

    # Capa 2: nada de esto existe dentro de public/.
    <LocationMatch "^/(composer\.json|composer\.lock|package\.json|package-lock\.json|npm-shrinkwrap\.json|UPGRADING\.md|CONTRIBUTING\.md|INSTALL\.txt|Gruntfile\.js|phpunit\.xml\.dist|phpcs\.xml\.dist|rector\.php|jest\.config\.js|tsconfig[^/]*\.json|xo\.config\.mjs|behat\.yml\.dist)$">
        Require all denied
    </LocationMatch>

    <LocationMatch "^/(vendor|vendor-bin|node_modules|bin|scripts)/">
        Require all denied
    </LocationMatch>

    <LocationMatch "/\.">
        Require all denied
    </LocationMatch>

    <LocationMatch "^/(server-status|server-info|status|ping)$">
        Require all denied
    </LocationMatch>

    <LocationMatch "^/(moodledata|climaintenance\.html)$">
        Require all denied
    </LocationMatch>
</VirtualHost>
