# Moodle endurecido para la ESOE. Dos capas: el docroot correcto y, por si alguien
# lo mueve, reglas que niegan lo que nunca vive dentro de public/.
#
# Verificado contra moodle/moodle rama MOODLE_503_STABLE: public/ contiene
# admin, lib, local, theme, r.php e index.php, y NO contiene ninguno de los
# archivos ni directorios que este fichero niega.
#
# Reemplace SITIO_FQDN y la ruta de instalacion antes de usarlo.

server {
    listen 80;
    server_name SITIO_FQDN;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name SITIO_FQDN;

    # Capa 1: el docroot. Desde la reestructura de Moodle 5.1 el codigo servible
    # vive en public/. Apuntar a la raiz del codigo publica el arbol interno.
    root /var/www/moodle/public;
    index index.php;

    ssl_certificate     /etc/ssl/esoe/moodle.crt;
    ssl_certificate_key /etc/ssl/esoe/moodle.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 100M;

    # Capa 2: nada de esto existe dentro de public/. Si responde, el docroot
    # esta mal puesto y estas reglas lo tapan mientras se corrige.
    location ~ ^/(composer\.json|composer\.lock|package\.json|package-lock\.json|npm-shrinkwrap\.json|UPGRADING\.md|CONTRIBUTING\.md|INSTALL\.txt|Gruntfile\.js|phpunit\.xml\.dist|phpcs\.xml\.dist|rector\.php|jest\.config\.js|tsconfig[^/]*\.json|xo\.config\.mjs|behat\.yml\.dist)$ {
        return 404;
    }

    location ~ ^/(vendor|vendor-bin|node_modules|bin|scripts)/ {
        return 404;
    }

    # Archivos ocultos, incluido .git y .env.
    location ~ /\. {
        return 404;
        access_log off;
    }

    # El estado de php-fpm no se publica.
    location ~ ^/(server-status|server-info|status|ping)$ {
        return 404;
    }

    # Los datos de Moodle nunca se sirven por el servidor web.
    location ~ ^/(moodledata|climaintenance\.html)$ {
        return 404;
    }

    # Enrutado de Moodle 5.1 en adelante: lo no encontrado va al enrutador r.php.
    location / {
        try_files $uri $uri/ /r.php$is_args$args;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        if (!-f $document_root$fastcgi_script_name) {
            rewrite ^ /r.php last;
        }
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 3600;
        fastcgi_index index.php;
        include fastcgi_params;
    }
}
