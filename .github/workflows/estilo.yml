name: Estilo

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: estilo-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  estilo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EVENTO: ${{ github.event_name }}
      MISMO_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      RAMA: ${{ github.head_ref || github.ref_name }}
      ANTES: ${{ github.event.pull_request.base.sha || github.event.before }}
      DESPUES: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Retirar comentarios
        if: env.MISMO_REPO == 'true'
        run: |
          node scripts/estilo.js --corregir > /dev/null || true
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nada que corregir."
            exit 0
          fi
          npx --no-install eslint .
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retira comentarios del codigo"
          git push origin "HEAD:$RAMA"
          gh workflow run ci.yml --ref "$RAMA"

      - name: Revisar codigo, commits y rama
        run: |
          args=(--rama "$RAMA")
          if [ -n "$ANTES" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            args+=(--commits "$ANTES..$DESPUES")
          fi
          node scripts/estilo.js "${args[@]}"
